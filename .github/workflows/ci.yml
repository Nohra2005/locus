name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Unit tests — no services, runs in seconds ──────────────────────
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: pip install pytest

      - name: Run unit tests
        run: pytest tests/test_vectorizer.py -v

  # ── Job 2: Integration + quality gate — needs full stack ──────────────────
  integration-tests:
    runs-on: self-hosted
    needs: unit-tests

    steps:
      - name: Fix workspace permissions
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" 2>/dev/null || true

      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up .env
        run: |
          cat > .env << EOF
          QDRANT_URL=${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY=${{ secrets.QDRANT_API_KEY }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          GATEWAY_BASE_URL=http://localhost:8000
          CORS_ORIGINS=*
          USERPROFILE=$HOME
          EOF

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-fashion-clip-${{ runner.os }}-v1

      - name: Start core services
        run: |
          USERPROFILE="$HOME" docker compose up -d gateway visual_engine attribute_tagger mlflow
        env:
          DOCKER_BUILDKIT: 1

      - name: Wait for gateway
        run: |
          echo "Waiting for gateway..."
          timeout 240 bash -c 'until curl -sf http://localhost:8000/ > /dev/null; do sleep 5; done'
          echo "Gateway ready."

      - name: Wait for visual engine
        run: |
          echo "Waiting for visual engine (model loading takes ~60s)..."
          timeout 360 bash -c 'until curl -sf http://localhost:8001/ > /dev/null; do sleep 10; done'
          echo "Visual engine ready."

      - name: Install test dependencies
        run: |
          python3 -m venv /tmp/test-venv
          /tmp/test-venv/bin/pip install pytest requests pillow
          echo "/tmp/test-venv/bin" >> $GITHUB_PATH

      - name: Run smoke tests
        run: pytest tests/test_smoke.py -v

      - name: Run integration tests
        run: pytest tests/test_pipeline.py -v
        env:
          GATEWAY_URL: http://localhost:8000
          VISUAL_URL:  http://localhost:8001
          TAGGER_URL:  http://localhost:8004

      - name: Run judge quality gate
        run: python mlops/ci_eval.py --gateway-url http://localhost:8000 --min-score 0.65
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --tail=50

      - name: Tear down
        if: always()
        run: docker compose down
