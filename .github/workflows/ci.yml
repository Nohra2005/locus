name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Unit tests — no services, runs in seconds ──────────────────────
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: pip install pytest

      - name: Run unit tests
        run: pytest tests/test_vectorizer.py -v

  # ── Job 2: Integration + quality gate — needs full stack ──────────────────
  integration-tests:
    runs-on: self-hosted
    needs: unit-tests

    steps:
      - name: Fix workspace permissions
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" 2>/dev/null || true

      - uses: actions/checkout@v4

      - name: Set up .env
        run: |
          cat > .env << EOF
          QDRANT_URL=${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY=${{ secrets.QDRANT_API_KEY }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          ADMIN_API_KEY=${{ secrets.ADMIN_API_KEY }}
          GATEWAY_BASE_URL=http://20.240.203.22:8000
          CORS_ORIGINS=*
          USERPROFILE=$HOME
          EOF

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-fashion-clip-${{ runner.os }}-v1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - name: Free disk space
        run: |
          docker image prune -a -f
          docker system prune -f --volumes

      - name: Build images (sequential to avoid OOM on self-hosted runner)
        run: |
          USERPROFILE="$HOME" docker compose build gateway
          USERPROFILE="$HOME" docker compose build visual_engine
          USERPROFILE="$HOME" docker compose build attribute_tagger
        env:
          DOCKER_BUILDKIT: 1

      - name: Reload images into Kubernetes
        run: |
          docker save locus/gateway:latest | sudo k3s ctr images import -
          docker save locus/visual-engine:latest | sudo k3s ctr images import -
          docker save locus/attribute-tagger:latest | sudo k3s ctr images import -
          kubectl rollout restart deployment/gateway deployment/visual-engine deployment/attribute-tagger
          kubectl rollout status deployment/gateway --timeout=180s
          kubectl rollout status deployment/visual-engine --timeout=360s
          kubectl rollout status deployment/attribute-tagger --timeout=120s

      - name: Wait for gateway
        run: |
          echo "Waiting for gateway..."
          timeout 240 bash -c 'until curl -sf http://20.240.203.22:8000/health > /dev/null; do sleep 5; done'
          echo "Gateway ready."

      - name: Port-forward internal services
        run: |
          kubectl port-forward svc/visual-engine 8001:8001 &
          kubectl port-forward svc/attribute-tagger 8004:8004 &
          echo "Waiting for visual engine (model loading takes ~60s)..."
          timeout 360 bash -c 'until curl -sf http://localhost:8001/health > /dev/null; do sleep 10; done'
          echo "Waiting for attribute tagger..."
          timeout 60 bash -c 'until curl -sf http://localhost:8004/health > /dev/null; do sleep 5; done'
          echo "Internal services ready."

      - name: Install test dependencies
        run: |
          python3 -m venv /tmp/test-venv
          /tmp/test-venv/bin/pip install pytest requests pillow
          echo "/tmp/test-venv/bin" >> $GITHUB_PATH

      - name: Run smoke tests
        run: pytest tests/test_smoke.py -v

      - name: Run integration tests
        run: pytest tests/test_pipeline.py -v
        env:
          GATEWAY_URL: http://20.240.203.22:8000
          VISUAL_URL:  http://localhost:8001
          TAGGER_URL:  http://localhost:8004

      - name: Wait for rate-limit window to reset
        run: sleep 65

      - name: Run judge quality gate
        run: python mlops/ci_eval.py --gateway-url http://20.240.203.22:8000
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Re-confirm gateway is up before E2E tests
        run: |
          echo "Re-confirming gateway is still reachable..."
          timeout 120 bash -c 'until curl -sf http://20.240.203.22:8000/health > /dev/null; do sleep 5; done'
          echo "Gateway confirmed."

      - name: Run E2E tests against deployed cloud system
        run: pytest tests/test_e2e.py -v
        env:
          GATEWAY_URL: http://20.240.203.22:8000

      - name: Show pod logs on failure
        if: failure()
        run: |
          kubectl logs deployment/gateway --tail=50 || true
          kubectl logs deployment/visual-engine --tail=50 || true
          kubectl logs deployment/attribute-tagger --tail=50 || true

      - name: Clean up port-forwards
        if: always()
        run: pkill -f "kubectl port-forward" || true
