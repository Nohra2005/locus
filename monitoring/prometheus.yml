global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:

  - job_name: 'gateway'
    static_configs:
      - targets: ['gateway:8000']

  - job_name: 'visual_engine'
    static_configs:
      - targets: ['visual_engine:8001']

  - job_name: 'attribute_tagger'
    static_configs:
      - targets: ['attribute_tagger:8004']

  - job_name: 'mlops_exporter'
    static_configs:
      - targets: ['mlops_exporter:8003']
