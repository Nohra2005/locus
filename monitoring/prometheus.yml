global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: 'gateway'
    static_configs:
      - targets: ['gateway:8000']

  - job_name: 'visual_engine'
    static_configs:
      - targets: ['visual_engine:8001']

  - job_name: 'ranking_engine'
    static_configs:
      - targets: ['ranking_engine:8002']
