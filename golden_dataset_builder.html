<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Locus — Golden Dataset Builder</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f0f13;
    color: #e8e8f0;
    min-height: 100vh;
    padding: 24px;
  }

  /* ── Layout ─────────────────────────────────────────────────── */
  .app { max-width: 1200px; margin: 0 auto; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 1px solid #2a2a3a;
  }

  .logo { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .logo span { color: #7c6af7; }

  .progress-wrap { text-align: right; }
  .progress-label { font-size: 13px; color: #888; margin-bottom: 6px; }
  .progress-bar-outer {
    width: 200px; height: 8px; background: #2a2a3a; border-radius: 4px; overflow: hidden;
  }
  .progress-bar-inner {
    height: 100%; background: linear-gradient(90deg, #7c6af7, #a78bfa);
    border-radius: 4px; transition: width 0.4s ease;
  }
  .progress-count {
    font-size: 18px; font-weight: 700; color: #a78bfa; margin-top: 4px;
  }

  /* ── Main grid ──────────────────────────────────────────────── */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }

  .panel {
    background: #17172a;
    border: 1px solid #2a2a3a;
    border-radius: 14px;
    padding: 20px;
  }

  .panel-title {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #7c6af7;
    margin-bottom: 16px;
  }

  /* ── Image card ─────────────────────────────────────────────── */
  .img-card {
    background: #0f0f1a;
    border: 1.5px dashed #2a2a3a;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 12px;
    transition: border-color 0.2s;
  }
  .img-card:focus-within { border-color: #7c6af7; }

  .img-preview-wrap {
    width: 100%;
    height: 160px;
    border-radius: 7px;
    overflow: hidden;
    background: #1a1a2a;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 10px;
  }
  .img-preview-wrap img {
    width: 100%; height: 100%; object-fit: cover;
  }
  .img-placeholder {
    color: #444;
    font-size: 13px;
    text-align: center;
    line-height: 1.6;
  }

  .img-card.query .img-preview-wrap { height: 220px; }

  .rel-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .rel-grid .img-card { margin-bottom: 0; }
  .rel-grid .img-preview-wrap { height: 130px; }
  .rel-grid .img-card:last-child:nth-child(odd) {
    grid-column: 1 / -1;
  }

  /* ── Inputs ─────────────────────────────────────────────────── */
  .field-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .field-row input { flex: 1; }

  input[type="text"], select, textarea {
    width: 100%;
    background: #1e1e30;
    border: 1px solid #2e2e45;
    border-radius: 7px;
    padding: 8px 12px;
    font-size: 13px;
    color: #e8e8f0;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus, select:focus {
    border-color: #7c6af7;
  }
  input[type="text"]::placeholder { color: #555; }

  select option { background: #1e1e30; }

  .input-label {
    font-size: 11px;
    color: #666;
    margin-bottom: 5px;
    font-weight: 500;
  }

  .rank-badge {
    width: 22px; height: 22px; min-width: 22px;
    background: #2a2a3a; border-radius: 50%;
    font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    color: #888;
  }

  /* ── Meta row ───────────────────────────────────────────────── */
  .meta-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 20px;
  }

  /* ── Buttons ────────────────────────────────────────────────── */
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px; font-weight: 600;
    border: none; cursor: pointer;
    transition: all 0.15s;
  }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .btn-primary {
    background: linear-gradient(135deg, #7c6af7, #a78bfa);
    color: #fff;
  }
  .btn-primary:not(:disabled):hover { filter: brightness(1.1); transform: translateY(-1px); }

  .btn-ghost {
    background: #2a2a3a;
    color: #ccc;
  }
  .btn-ghost:hover { background: #33334a; }

  .btn-danger {
    background: #3a1a1a;
    color: #f87171;
  }
  .btn-danger:hover { background: #4a2020; }

  .actions {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 32px;
  }

  /* ── Status toast ───────────────────────────────────────────── */
  #toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    background: #2a2a3a; border: 1px solid #3a3a55;
    padding: 12px 24px; border-radius: 10px;
    font-size: 14px; font-weight: 500;
    opacity: 0; transition: opacity 0.3s;
    pointer-events: none; z-index: 999;
    max-width: 420px; text-align: center;
  }
  #toast.show { opacity: 1; }
  #toast.success { border-color: #4ade80; color: #4ade80; }
  #toast.error   { border-color: #f87171; color: #f87171; }
  #toast.warn    { border-color: #facc15; color: #facc15; }

  /* ── Log panel ──────────────────────────────────────────────── */
  .log-panel {
    background: #17172a;
    border: 1px solid #2a2a3a;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .log-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px;
  }
  .log-title { font-size: 13px; font-weight: 600; color: #7c6af7; text-transform: uppercase; letter-spacing: 0.08em; }

  .entry-list { display: flex; flex-direction: column; gap: 8px; }

  .entry-row {
    display: flex; align-items: center; gap: 12px;
    background: #0f0f1a; border-radius: 8px; padding: 10px 14px;
    font-size: 13px;
  }
  .entry-row .entry-thumb {
    width: 36px; height: 36px; border-radius: 5px; object-fit: cover;
    background: #2a2a3a; flex-shrink: 0;
  }
  .entry-row .entry-info { flex: 1; min-width: 0; }
  .entry-row .entry-name {
    font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .entry-row .entry-meta { color: #666; font-size: 11px; margin-top: 2px; }
  .entry-row .entry-del {
    background: none; border: none; cursor: pointer;
    color: #555; font-size: 16px; padding: 2px 6px; border-radius: 4px;
    transition: color 0.15s;
  }
  .entry-row .entry-del:hover { color: #f87171; }

  .empty-state {
    color: #444; font-size: 13px; text-align: center; padding: 24px 0;
  }

  /* ── Config bar ─────────────────────────────────────────────── */
  .config-bar {
    display: flex; gap: 12px; align-items: center;
    background: #17172a; border: 1px solid #2a2a3a; border-radius: 10px;
    padding: 12px 16px; margin-bottom: 20px; flex-wrap: wrap;
    font-size: 13px;
  }
  .config-bar label { color: #888; white-space: nowrap; }
  .config-bar input[type="text"] { width: 280px; }

  /* ── Scrollable log ─────────────────────────────────────────── */
  .entry-scroll { max-height: 300px; overflow-y: auto; }
  .entry-scroll::-webkit-scrollbar { width: 4px; }
  .entry-scroll::-webkit-scrollbar-thumb { background: #3a3a55; border-radius: 2px; }
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header>
    <div class="logo">Locus <span>Golden Dataset Builder</span></div>
    <div class="progress-wrap">
      <div class="progress-label">Progress</div>
      <div class="progress-bar-outer">
        <div class="progress-bar-inner" id="progressBar" style="width:0%"></div>
      </div>
      <div class="progress-count"><span id="progressCount">0</span> / 60</div>
    </div>
  </header>

  <!-- Config bar -->
  <div class="config-bar">
    <label>Gateway URL</label>
    <input type="text" id="gatewayUrl" value="http://localhost:8000"
           placeholder="http://localhost:8000" style="width:240px;" />
    <label style="margin-left:12px;">Target</label>
    <input type="text" id="targetCount" value="60"
           placeholder="60" style="width:60px;" />
    <div style="margin-left:auto; display:flex; gap:8px;">
      <button class="btn btn-ghost" onclick="exportJSON()">⬇ Export JSON</button>
      <button class="btn btn-ghost" onclick="clearAll()" style="color:#f87171;">🗑 Clear All</button>
    </div>
  </div>

  <!-- Meta row -->
  <div class="meta-row">
    <div>
      <div class="input-label">Query item name</div>
      <input type="text" id="queryName" placeholder="e.g. black leather biker jacket" />
    </div>
    <div>
      <div class="input-label">Category</div>
      <select id="queryCategory">
        <option value="">— select category —</option>
        <option>top</option>
        <option>sports_bra</option>
        <option>pants</option>
        <option>leggings</option>
        <option>shorts</option>
        <option>skirt</option>
        <option>dress</option>
        <option>sweater</option>
        <option>jacket</option>
        <option>shoes</option>
        <option>hat</option>
        <option>bag</option>
        <option>jumpsuit</option>
      </select>
    </div>
  </div>

  <!-- Main grid -->
  <div class="grid">

    <!-- Query image -->
    <div class="panel">
      <div class="panel-title">🔍 Query Image (your Google search)</div>
      <div class="img-card query" id="queryCard">
        <div class="img-preview-wrap" id="queryPreviewWrap">
          <div class="img-placeholder">Paste URL below<br/>to preview</div>
        </div>
        <div class="input-label">Image URL</div>
        <input type="text" id="queryUrl" placeholder="https://…"
               oninput="previewImage('queryUrl','queryPreviewWrap')" />
      </div>
    </div>

    <!-- Relevant images -->
    <div class="panel">
      <div class="panel-title">✅ 5 Google Lens Matches (ground truth)</div>
      <div class="rel-grid" id="relGrid">
        <!-- generated by JS -->
      </div>
    </div>

  </div>

  <!-- Action buttons -->
  <div class="actions">
    <button class="btn btn-primary" id="submitBtn" onclick="submitSet()">
      ⚡ Index &amp; Save
    </button>
    <button class="btn btn-ghost" onclick="resetForm()">↺ Clear form</button>
    <span id="submitStatus" style="font-size:13px; color:#888;"></span>
  </div>

  <!-- Log -->
  <div class="log-panel">
    <div class="log-header">
      <div class="log-title">📋 Saved Entries</div>
      <span id="entryCount" style="font-size:13px; color:#666;">0 entries</span>
    </div>
    <div class="entry-scroll">
      <div class="entry-list" id="entryList">
        <div class="empty-state">No entries yet. Fill the form above and click "Index &amp; Save".</div>
      </div>
    </div>
  </div>

</div><!-- /app -->

<!-- Toast -->
<div id="toast"></div>

<script>
// ─── State ─────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'locus_golden_dataset';
let dataset = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

// ─── Init ───────────────────────────────────────────────────────────────────
function init() {
  buildRelGrid();
  renderLog();
  updateProgress();
}

// ─── Build relevant image grid ──────────────────────────────────────────────
function buildRelGrid() {
  const grid = document.getElementById('relGrid');
  grid.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    grid.innerHTML += `
      <div class="img-card" id="relCard${i}">
        <div class="img-preview-wrap" id="relPreview${i}">
          <div class="img-placeholder">Paste URL<br/>below</div>
        </div>
        <div class="field-row" style="margin-bottom:6px;">
          <div class="rank-badge">${i+1}</div>
          <input type="text" id="relUrl${i}" placeholder="Image URL"
                 oninput="previewImage('relUrl${i}','relPreview${i}')" />
        </div>
        <input type="text" id="relName${i}" placeholder="Name (e.g. slim denim jacket)" />
      </div>`;
  }
}

// ─── Preview image on URL paste ─────────────────────────────────────────────
function previewImage(inputId, previewId) {
  const url   = document.getElementById(inputId).value.trim();
  const wrap  = document.getElementById(previewId);
  if (!url) {
    wrap.innerHTML = '<div class="img-placeholder">Paste URL<br/>to preview</div>';
    return;
  }
  wrap.innerHTML = `<img src="${url}" onerror="this.parentNode.innerHTML='<div class=img-placeholder style=color:#f87171>⚠ Cannot load image</div>'" />`;
}

// ─── Compute product_id (must match build_golden_from_lens.py) ──────────────
function uuidv5Locus(imgUrl) {
  // We mirror the Python logic: uuid5(NAMESPACE_URL, "golden::" + imgUrl)
  // Pure-JS UUID v5 implementation using SubtleCrypto
  return computeUUIDv5(imgUrl);
}

// UUID v5 using SHA-1 (matches Python uuid.uuid5 exactly)
async function computeUUIDv5Async(imgUrl) {
  const DNS_NAMESPACE = '6ba7b811-9dad-11d1-80b4-00c04fd430c8'; // NAMESPACE_URL
  const name = 'golden::' + imgUrl;
  const nsBytes = uuidToBytes(DNS_NAMESPACE);
  const nameBytes = new TextEncoder().encode(name);
  const combined = new Uint8Array(nsBytes.length + nameBytes.length);
  combined.set(nsBytes); combined.set(nameBytes, nsBytes.length);
  const hashBuffer = await crypto.subtle.digest('SHA-1', combined);
  const hash = new Uint8Array(hashBuffer);
  hash[6] = (hash[6] & 0x0f) | 0x50;  // version 5
  hash[8] = (hash[8] & 0x3f) | 0x80;  // variant bits
  return bytesToUUID(hash.slice(0, 16));
}

function uuidToBytes(uuid) {
  const hex = uuid.replace(/-/g, '');
  return new Uint8Array(hex.match(/.{2}/g).map(b => parseInt(b, 16)));
}

function bytesToUUID(bytes) {
  const hex = Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
  return [hex.slice(0,8), hex.slice(8,12), hex.slice(12,16), hex.slice(16,20), hex.slice(20)].join('-');
}

// ─── Submit set ─────────────────────────────────────────────────────────────
async function submitSet() {
  const gateway     = document.getElementById('gatewayUrl').value.trim() || 'http://localhost:8000';
  const queryUrl    = document.getElementById('queryUrl').value.trim();
  const queryName   = document.getElementById('queryName').value.trim() || `query_${dataset.length + 1}`;
  const queryCat    = document.getElementById('queryCategory').value;

  if (!queryUrl) { toast('Paste a query image URL first.', 'warn'); return; }

  // Collect relevant images
  const relevant = [];
  for (let i = 0; i < 5; i++) {
    const url  = document.getElementById(`relUrl${i}`).value.trim();
    const name = document.getElementById(`relName${i}`).value.trim() || `${queryCat || 'item'}_${dataset.length+1}_${i+1}`;
    if (url) relevant.push({ url, name });
  }

  if (relevant.length === 0) { toast('Add at least 1 relevant image URL.', 'warn'); return; }
  if (relevant.length < 5)   { toast(`Only ${relevant.length}/5 relevant URLs filled. Continue?`, 'warn'); }

  const btn = document.getElementById('submitBtn');
  const status = document.getElementById('submitStatus');
  btn.disabled = true;
  status.textContent = 'Indexing…';

  // Build batch items
  const items = relevant.map(r => ({
    name:       r.name,
    image_url:  r.url,
    store:      'golden_dataset',
    mall:       'golden_dataset',
    price:      '',
    product_id: null,  // will be set after async UUID computation
  }));

  // Compute product_ids
  const productIds = await Promise.all(relevant.map(r => computeUUIDv5Async(r.url)));
  items.forEach((item, i) => { item.product_id = productIds[i]; });

  let indexResult = { success: 0, skipped: 0, failed: [] };

  try {
    const resp = await fetch(`${gateway}/add-bulk-batch`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ items }),
    });
    if (!resp.ok) throw new Error(`Gateway returned ${resp.status}`);
    indexResult = await resp.json();
    status.textContent = `✅ ${indexResult.success} indexed, ${indexResult.skipped} skipped, ${indexResult.failed?.length || 0} failed`;
  } catch (err) {
    status.textContent = `❌ Gateway error: ${err.message}`;
    toast(`Could not reach gateway: ${err.message}`, 'error');
    btn.disabled = false;
    return;
  }

  // Identify failed item names
  const failedNames = new Set((indexResult.failed || []).map(f => f.item));
  const accepted = relevant.filter(r => !failedNames.has(r.name));

  if (accepted.length === 0) {
    toast('All images failed to index. Check names and gateway.', 'error');
    btn.disabled = false;
    return;
  }

  const acceptedProductIds = await Promise.all(accepted.map(r => computeUUIDv5Async(r.url)));

  // Save entry
  const entry = {
    query_image_url:      queryUrl,
    query_name:           queryName,
    query_category_tag:   queryCat,
    relevant_product_ids: acceptedProductIds,
    relevant_info: accepted.map((r, i) => ({
      product_id: acceptedProductIds[i],
      name:       r.name,
      image_url:  r.url,
      store_name: 'golden_dataset',
    })),
    source:       'google_lens',
    n_relevant:   accepted.length,
    annotated_by: 'marc',
    created_at:   new Date().toISOString(),
  };

  dataset.push(entry);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(dataset));

  toast(`Set ${dataset.length} saved! ${accepted.length} relevant images indexed.`, 'success');
  renderLog();
  updateProgress();
  resetForm();
  btn.disabled = false;
}

// ─── Reset form ─────────────────────────────────────────────────────────────
function resetForm() {
  document.getElementById('queryUrl').value   = '';
  document.getElementById('queryName').value  = '';
  document.getElementById('queryCategory').value = '';
  document.getElementById('queryPreviewWrap').innerHTML =
    '<div class="img-placeholder">Paste URL below<br/>to preview</div>';
  document.getElementById('submitStatus').textContent = '';
  for (let i = 0; i < 5; i++) {
    document.getElementById(`relUrl${i}`).value   = '';
    document.getElementById(`relName${i}`).value  = '';
    document.getElementById(`relPreview${i}`).innerHTML =
      '<div class="img-placeholder">Paste URL<br/>below</div>';
  }
}

// ─── Delete entry ────────────────────────────────────────────────────────────
function deleteEntry(idx) {
  if (!confirm(`Delete entry "${dataset[idx].query_name}"?`)) return;
  dataset.splice(idx, 1);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(dataset));
  renderLog();
  updateProgress();
  toast('Entry deleted.', 'warn');
}

// ─── Render log ─────────────────────────────────────────────────────────────
function renderLog() {
  const list = document.getElementById('entryList');
  document.getElementById('entryCount').textContent = `${dataset.length} entries`;

  if (dataset.length === 0) {
    list.innerHTML = '<div class="empty-state">No entries yet. Fill the form above and click "Index &amp; Save".</div>';
    return;
  }

  list.innerHTML = dataset.map((e, i) => `
    <div class="entry-row">
      <img class="entry-thumb" src="${e.query_image_url}"
           onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22/>'"/>
      <div class="entry-info">
        <div class="entry-name">${e.query_name}</div>
        <div class="entry-meta">${e.query_category_tag || '—'} &bull; ${e.n_relevant} relevant &bull; ${new Date(e.created_at).toLocaleDateString()}</div>
      </div>
      <button class="entry-del" onclick="deleteEntry(${i})" title="Delete">✕</button>
    </div>
  `).join('');
}

// ─── Update progress bar ────────────────────────────────────────────────────
function updateProgress() {
  const target = parseInt(document.getElementById('targetCount').value) || 60;
  const n = dataset.length;
  const pct = Math.min(100, (n / target) * 100);
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressCount').textContent = n;
}

// ─── Export JSON ────────────────────────────────────────────────────────────
function exportJSON() {
  if (dataset.length === 0) { toast('Nothing to export yet.', 'warn'); return; }
  const blob = new Blob([JSON.stringify(dataset, null, 2)], { type: 'application/json' });
  const a    = document.createElement('a');
  a.href     = URL.createObjectURL(blob);
  a.download = 'golden_dataset.json';
  a.click();
  toast(`Exported ${dataset.length} entries as golden_dataset.json`, 'success');
}

// ─── Clear all ───────────────────────────────────────────────────────────────
function clearAll() {
  if (!confirm('Delete ALL entries? This cannot be undone.')) return;
  dataset = [];
  localStorage.setItem(STORAGE_KEY, JSON.stringify(dataset));
  renderLog();
  updateProgress();
  toast('All entries cleared.', 'warn');
}

// ─── Toast ───────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className   = 'show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 3500);
}

// ─── Boot ────────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
