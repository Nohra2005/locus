# LOCUS: docker-compose.yml
#
# MODE: CLOUD — Qdrant runs on Qdrant Cloud (shared with teammates).
#
# Setup (one time):
#   1. Go to https://cloud.qdrant.io and create a free cluster
#   2. Copy your cluster URL and API key
#   3. Create a .env file in this folder (see .env.example):
#        QDRANT_URL=https://your-cluster.qdrant.io:6333
#        QDRANT_API_KEY=your-api-key-here
#   4. Add .env to your .gitignore — never commit it
#   5. Run: docker compose up --build
#
# To switch back to LOCAL mode:
#   - Comment out QDRANT_URL and QDRANT_API_KEY in gateway environment
#   - Uncomment QDRANT_HOST and QDRANT_PORT
#   - Uncomment the entire `qdrant:` service block at the bottom

services:

  # ── 1. Gateway ────────────────────────────────────────────────────
  gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    depends_on:
      visual_engine:
        condition: service_started
      # ranking_engine dependency removed — gateway uses Qdrant directly for search.
      # Re-enable when ranking_engine is repurposed as a cross-encoder re-ranker (Phase 3).
    environment:
      - VISUAL_HOST=http://visual_engine:8001
      # RANKING_HOST reserved for Phase 3 cross-encoder re-ranking
      # - RANKING_HOST=http://ranking_engine:8002
      # CLOUD mode (active) — requires .env file
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      # LOCAL mode (commented out)
      # - QDRANT_HOST=qdrant
      # - QDRANT_PORT=6333
    volumes:
      - ./gateway:/app
    dns:
      - 8.8.8.8
      - 1.1.1.1

  # ── 2. Visual Engine ──────────────────────────────────────────────
  visual_engine:
    build: ./visual_engine
    ports:
      - "8001:8001"
    volumes:
      - ./visual_engine:/app
      - ${USERPROFILE}/.cache/huggingface:/root/.cache/huggingface
    environment:
      - TRANSFORMERS_CACHE=/root/.cache/huggingface
    dns:
      - 8.8.8.8
      - 1.1.1.1

  # ── 3. Ranking Engine ─────────────────────────────────────────────
  # CURRENTLY DISABLED — gateway ranks via Qdrant cosine similarity directly.
  # Re-enable in Phase 3 when implementing BLIP ensemble cross-encoder re-ranking.
  # ranking_engine:
  #   build: ./ranking_engine
  #   ports:
  #     - "8002:8002"
  #   volumes:
  #     - ./ranking_engine:/app

  # ── 4. Local Qdrant (commented out — using cloud instead) ─────────
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   ports:
  #     - "6333:6333"
  #   volumes:
  #     - qdrant_data:/qdrant/storage
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -sf http://localhost:6333/readyz || exit 1"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 10
  #     start_period: 10s

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri /mlflow/mlruns
      --default-artifact-root mlflow-artifacts:/
      --serve-artifacts
    volumes:
      - mlflow_data:/mlflow

volumes:
  qdrant_data:  # uncomment qdrant service block above to use local mode
  mlflow_data: