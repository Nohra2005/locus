# LOCUS: docker-compose.yml
#
# MODE: CLOUD — Qdrant runs on Qdrant Cloud (shared with teammates).
#
# Setup (one time):
#   1. Go to https://cloud.qdrant.io and create a free cluster
#   2. Copy your cluster URL and API key
#   3. Create a .env file in this folder (see .env.example):
#        QDRANT_URL=https://your-cluster.qdrant.io:6333
#        QDRANT_API_KEY=your-api-key-here
#   4. Add .env to your .gitignore — never commit it
#   5. Run: docker compose up --build
#
# To switch back to LOCAL mode:
#   - Comment out QDRANT_URL and QDRANT_API_KEY in gateway environment
#   - Uncomment QDRANT_HOST and QDRANT_PORT
#   - Uncomment the entire `qdrant:` service block at the bottom

services:

  # ── 1. Gateway ────────────────────────────────────────────────────
  gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    depends_on:
      visual_engine:
        condition: service_started
      attribute_tagger:
        condition: service_healthy
    environment:
      - VISUAL_HOST=http://visual_engine:8001
      - TAGGER_HOST=http://attribute_tagger:8004
      # CLOUD mode (active) — requires .env file
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      # LOCAL mode (commented out)
      # - QDRANT_HOST=qdrant
      # - QDRANT_PORT=6333
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GATEWAY_BASE_URL=${GATEWAY_BASE_URL:-http://localhost:8000}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - GOLDEN_DATASET_PATH=/mlops/golden_dataset.json
    volumes:
      - ./gateway:/app
      - ./mlops:/mlops
      - ./mlops/golden_images:/mlops/golden_images
    dns:
      - 8.8.8.8
      - 1.1.1.1

  # ── 2. Visual Engine ──────────────────────────────────────────────
  visual_engine:
    build: ./visual_engine
    ports:
      - "8001:8001"
    volumes:
      - ./visual_engine:/app
      - ${USERPROFILE}/.cache/huggingface:/root/.cache/huggingface
      - ${USERPROFILE}/.cache/clip:/root/.cache/clip
    environment:
      - TRANSFORMERS_CACHE=/root/.cache/huggingface
      - TRANSFORMERS_OFFLINE=1
      - HF_DATASETS_OFFLINE=1
    dns:
      - 8.8.8.8
      - 1.1.1.1

  # ── 3. Attribute Tagger ───────────────────────────────────────────────────────
  # Calls Gemini 2.0 Flash (VLM) via OpenRouter to extract rich visual attributes
  # from the query crop: colors, style, silhouette, occasion, pattern, material,
  # trend tags. Runs as a background task — zero latency impact on /search.
  # Enables /refine: style-guided or color-guided CLIP text re-query.
  attribute_tagger:
    build: ./attribute_tagger
    ports:
      - "8004:8004"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8004/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ── 4. Local Qdrant (commented out — using cloud instead) ─────────
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   ports:
  #     - "6333:6333"
  #   volumes:
  #     - qdrant_data:/qdrant/storage
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -sf http://localhost:6333/readyz || exit 1"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 10
  #     start_period: 10s

  # ── 5. MLflow ─────────────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri /mlflow/mlruns
      --default-artifact-root mlflow-artifacts:/
      --serve-artifacts
    volumes:
      - mlflow_data:/mlflow

  # ── 6. Link Health Monitor ───────────────────────────────────────
  # Runs repair_broken_links.py every 5 days.
  # Phase 1: HEAD-checks every image_url in locus_items.
  # Phase 2: Marks dead items broken=True (hidden from search immediately).
  # Phase 3: Re-scrapes affected stores, re-indexes recovered items, deletes old points.
  # Report written to mlops/link_health_report.json after each run.
  # To run manually: docker compose exec gateway python repair_broken_links.py
  link_monitor:
    build: ./gateway
    working_dir: /app
    command: >
      sh -c "while true; do
        echo '[LINK MONITOR] Starting run at $$(date)';
        python repair_broken_links.py;
        echo '[LINK MONITOR] Done. Sleeping 5 days.';
        sleep 432000;
      done"
    volumes:
      - ./gateway:/app
      - ./mlops:/mlops
    environment:
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - VISUAL_URL=http://visual_engine:8001
      - GATEWAY_URL=http://gateway:8000
    depends_on:
      - gateway
      - visual_engine
    restart: unless-stopped

  # ── 7. MLops Automated Retraining ────────────────────────────────
  # Runs retrain_clip.py on a 48h schedule.
  # Also triggered on-demand via POST /trigger-retrain on the gateway.
  # Pipeline: build pairs → train LoRA → eval on golden → promote/rollback.
  # All results logged to MLflow under experiment "locus_lora_retraining".
  mlops_retrain:
    build:
      context: .
      dockerfile: mlops/Dockerfile.retrain
    working_dir: /mlops
    command: ["python", "retrain_clip.py", "--schedule", "48"]
    volumes:
      - ./mlops:/mlops
      - ./visual_engine:/visual_engine
      - ${USERPROFILE}/.cache/huggingface:/root/.cache/huggingface
    environment:
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - GATEWAY_URL=http://gateway:8000
      - VISUAL_HOST=http://visual_engine:8001
      - VISUAL_ENGINE_MODELS=/visual_engine/models
      - VISUAL_ENGINE_MODELS_INTERNAL=/app/models
      - MIN_FEEDBACK_PAIRS=50
      - MIN_ACS_THRESHOLD=0.70
      - MAX_TRAIN_STEPS=${MAX_TRAIN_STEPS:-150}
      - LOG_EVERY_STEPS=${LOG_EVERY_STEPS:-20}
      - GIT_PYTHON_REFRESH=quiet
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - TRANSFORMERS_CACHE=/root/.cache/huggingface
    depends_on:
      - gateway
      - mlflow
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1

  # ── 7. MLops Metrics Exporter ────────────────────────────────────
  mlops_exporter:
    build:
      context: .
      dockerfile: mlops/Dockerfile.exporter
    working_dir: /mlops
    ports:
      - "8003:8003"
    volumes:
      - ./mlops:/mlops
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - GEMINI_RESULTS_PATH=/mlops/gemini_judge_results.json
      - VSS_CACHE_PATH=/mlops/vss_cache.json
      - METRICS_PORT=8003
      - REFRESH_SECS=30
    restart: unless-stopped

  # ── 7. Prometheus ─────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - gateway
      - visual_engine
      - mlops_exporter

  # ── 7. Grafana ────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.3
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning

volumes:
  qdrant_data:  # uncomment qdrant service block above to use local mode
  mlflow_data:
  grafana_data:
